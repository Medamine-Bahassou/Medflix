apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def buildStamp = new Date().format('yyyyMMddHHmm')
// for npm run release, which tags the GitHub release with it
tasks.register('writeBuildStamp') { doLast { file("$buildDir/build-stamp.txt").text = buildStamp } }
preBuild.dependsOn 'writeBuildStamp'

android {
    namespace = "com.medanime.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.medanime.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((int) (System.currentTimeMillis() / 60000)) // minutes since 1970: every build installs as an update
        versionName "1.0"
        // the build's stamp (yyyymmddhhmm): a GitHub release tagged b + a later one is an update (Updater.kt; package.json release tags it)
        buildConfigField "String", "BUILD", "\"${buildStamp}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    testOptions { unitTests.returnDefaultValues = true } // the live tests run app code that touches Android (logs, cookies) on the JVM
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.google.android.gms:play-services-cast-framework:22.1.0" // casting to a TV (Cast.java)
    implementation "androidx.mediarouter:mediarouter:1.7.0"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion" // a script in the players' frames (MainActivity)
    // the native app (ui/): Compose screens, posters through Coil, witanime's HTML through Jsoup, requests through OkHttp
    implementation platform("androidx.compose:compose-bom:2025.10.01")
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "io.coil-kt.coil3:coil-compose:3.3.0"
    implementation "io.coil-kt.coil3:coil-network-okhttp:3.3.0"
    implementation "org.jsoup:jsoup:1.21.2"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517" // Android's org.json is a stub in JVM tests (WitanimeTest)
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

kotlin { jvmToolchain(21) } // same as capacitor.build.gradle's Java

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
